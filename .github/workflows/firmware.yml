name: Firmware CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid tag {tag!r}; expected X.Y.Z without a 'v' prefix")

          source = pathlib.Path("main.cpp").read_text(encoding="utf-8")
          match = re.search(r'FIRMWARE_VERSION\s*=\s*"([^"]+)"', source)
          if not match:
              raise SystemExit("FIRMWARE_VERSION was not found in main.cpp")
          if tag != match.group(1):
              raise SystemExit(
                  f"Tag {tag} does not match FIRMWARE_VERSION {match.group(1)}"
              )
          PY

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18

      - name: Build firmware
        run: pio run --project-conf ci/platformio-release.ini -e ats-mini

      - name: Prepare firmware package
        run: |
          set -euo pipefail
          mkdir -p release

          cp .pio/build/ats-mini/firmware.bin release/
          cp .pio/build/ats-mini/bootloader.bin release/
          cp .pio/build/ats-mini/partitions.bin release/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin release/
          cp ATSMINI/ci/LEEME-RELEASE.txt release/

          printf '0x0000 bootloader.bin\n0x8000 partitions.bin\n0xe000 boot_app0.bin\n0x10000 firmware.bin\n' > release/FLASH-OFFSETS.txt
          cd release
          sha256sum *.bin > SHA256SUMS.txt
          zip -j KALIMAN-ATS-MINI.zip *.bin *.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_id }}
          path: release/

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware package
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.run_id }}
          path: release/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; it will not be overwritten."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release/*.bin release/*.txt release/*.zip \
            --verify-tag --generate-notes --title "KALIMAN $RELEASE_TAG"
