    <path d="M-14 28h14M-14 52h14M-14 76h14M-14 100h14M136 28h14M136 52h14M136 76h14M136 100h14M28-14v14M52-14v14M76-14v14M100-14v14M28 136v14M52 136v14M76 136v14M100 136v14" stroke="#56e0c2" stroke-width="4" stroke-linecap="round"/>
