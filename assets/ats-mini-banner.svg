<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">ATS Mini Firmware</title>
  <desc id="desc">Banner for the ATS Mini firmware repository, with a microcontroller-inspired circuit design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#10253a"/>
      <stop offset="1" stop-color="#123d4c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56e0c2"/>
      <stop offset="1" stop-color="#6da8ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9bd5e7" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="1320" cy="210" r="220" fill="#35d4b0" opacity=".06"/>
  <circle cx="1320" cy="210" r="155" fill="none" stroke="#56e0c2" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="1320" cy="210" r="116" fill="none" stroke="#6da8ff" stroke-opacity=".25" stroke-width="2" stroke-dasharray="5 12"/>
  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity=".8">
    <path d="M1000 118h110v55h74"/><path d="M1000 175h72v80h112"/><path d="M1000 307h140v-38h62"/>
    <path d="M1450 145h-54v-35h-74"/><path d="M1450 235h-83v70h-54"/><path d="M1428 338h-88v48h-105"/>
    <path d="M1272 105v-38h-74"/><path d="M1350 343v54h74"/>
  </g>
  <g fill="#56e0c2" filter="url(#glow)">
