name: Publicar KALIMAN

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar etiqueta y versión
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Etiqueta inválida: ${tag} (esperado vX.Y.Z)"
            exit 1
          fi

          version="${tag#v}"
          version_found=""

          for candidate in "src/main.cpp" "main (6).cpp"; do
            if [[ -f "$candidate" ]]; then
              match="$(grep -Eo 'FIRMWARE_VERSION[[:space:]]*=[[:space:]]*"[^"]+"' "$candidate" | head -n 1 || true)"
              if [[ -n "$match" ]]; then
                version_found="$(python - <<'PY' "$match"
import re, sys
m = re.search(r'"([^"]+)"', sys.argv[1])
print(m.group(1) if m else '')
PY
)"
                break
              fi
            fi
          done

          if [[ -z "$version_found" ]]; then
            echo "No se encontró FIRMWARE_VERSION en src/main.cpp ni main (6).cpp"
            exit 1
          fi

          if [[ "$version" != "$version_found" ]]; then
            echo "La etiqueta ${tag} no coincide con FIRMWARE_VERSION ${version_found}"
            exit 1
          fi

      - name: Instalar PlatformIO
        run: python -m pip install platformio==6.1.18

      - name: Compilar firmware
        run: pio run --project-conf ci/platformio-release.ini -e ats-mini

      - name: Preparar artefactos de release
        run: |
          set -euo pipefail
          mkdir -p release

          cp .pio/build/ats-mini/firmware.bin release/
          cp .pio/build/ats-mini/bootloader.bin release/
          cp .pio/build/ats-mini/partitions.bin release/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin release/

          printf '0x0000 bootloader.bin\n0x8000 partitions.bin\n0xe000 boot_app0.bin\n0x10000 firmware.bin\n' > release/FLASH-OFFSETS.txt
          cp ci/LEEME-RELEASE.txt release/

          cd release
          sha256sum *.bin > SHA256SUMS.txt
          zip -j KALIMAN-ATS-MINI.zip *.bin *.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KALIMAN-ATS-MINI
          path: release/

      - name: Publicar Release solo si no existe
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "La release ${RELEASE_TAG} ya existe; no se sobrescribe."
            exit 0
          fi
          gh release create "${RELEASE_TAG}" release/*.bin release/*.txt release/*.zip --verify-tag --generate-notes --title "KALIMAN ${RELEASE_TAG}"
