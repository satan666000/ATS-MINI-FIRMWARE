name: Publicar KALIMAN
on:
  push:
    tags:
      - 'v[0-9]*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar versión
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          source = pathlib.Path('src/main.cpp').read_text()
          version = re.search(r'FIRMWARE_VERSION\s*=\s*"([^"]+)"', source).group(1)
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('La etiqueta debe coincidir con FIRMWARE_VERSION: v' + version)
          PY
      - name: Instalar compilador
        run: python -m pip install platformio==6.1.18
      - name: Compilar
        run: pio run --project-conf ci/platformio-release.ini -e ats-mini
      - name: Preparar archivos y sumas de comprobación
        run: |
          mkdir -p release
          cp .pio/build/ats-mini/firmware.bin release/
          cp .pio/build/ats-mini/bootloader.bin release/
          cp .pio/build/ats-mini/partitions.bin release/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin release/
          printf '0x0000 bootloader.bin\n0x8000 partitions.bin\n0xe000 boot_app0.bin\n0x10000 firmware.bin\n' > release/FLASH-OFFSETS.txt
          cp ci/LEEME-RELEASE.txt release/
          cd release
          sha256sum *.bin > SHA256SUMS.txt
          zip KALIMAN-ATS-MINI.zip *.bin *.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KALIMAN-ATS-MINI
          path: release/
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.bin release/*.txt release/*.zip --verify-tag --generate-notes --title "KALIMAN $RELEASE_TAG"
